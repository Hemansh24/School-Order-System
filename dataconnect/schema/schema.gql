

type Organisation
  @table(name: "organisations") {
  id: Int64! @col(name: "id")
  groupCode: String @col(name: "group_code")
  ptCode: String @col(name: "pt_code")
  prCode: String! @col(name: "pr_code")

  organisationName: String! @col(name: "organisation_name")
  address: String
  district: String
  state: String
  pinCode: String @col(name: "pin_code")

  phone: String
  email: String
  website: String

  actionStatus: String @col(name: "action_status")
  remark: String
  academicYear: String @col(name: "academic_year")
  strength: Int
  boardType: String @col(name: "board_type")
  sessionStartFrom: Date @col(name: "session_start_from")
  minorityType: String @col(name: "minority_type")
  saturdayStatus: String @col(name: "saturday_status")
  workingStatus: Boolean @col(name: "working_status")

  sourceSheetRow: Int @col(name: "source_sheet_row")
  sourceHash: String @col(name: "source_hash")

  createdAt: Timestamp! @col(name: "created_at")
  updatedAt: Timestamp! @col(name: "updated_at")
  syncedAt: Timestamp! @col(name: "synced_at")
}

type Bookseller
  @table(name: "booksellers") {
  id: Int64! @col(name: "id")

  booksellerCode: String! @col(name: "bookseller_code")
  booksellerSubCode: String @col(name: "bookseller_sub_code")
  booksellerName: String! @col(name: "bookseller_name")
  academicYear: String @col(name: "academic_year")

  address01: String @col(name: "address_01")
  district: String
  state: String
  pinCode: String @col(name: "pin_code")
  gstPin: String @col(name: "gst_pin")

  incumbentCode: String @col(name: "incumbent_code")
  incumbentName: String @col(name: "incumbent_name")
  contactNumber: String @col(name: "contact_number")
  email: String

  vendorType: String @col(name: "vendor_type")
  actualDiscount: String @col(name: "actual_discount", dataType: "text")
  remark: String

  sourceRow: Int @col(name: "source_row")
  sourceHash: String @col(name: "source_hash")

  createdAt: Timestamp! @col(name: "created_at")
  updatedAt: Timestamp! @col(name: "updated_at")
  syncedAt: Timestamp! @col(name: "synced_at")
}

type Item
@table(name:"items") {

  id: Int64!

  itemSerialNo: Int @col(name:"item_serial_no")

  title: String!

  categoryType: String @col(name:"category_type")

  categoryCode: String @col(name:"category_code")

  subCategoryCode: String @col(name:"sub_category_code")

  languageCode: String @col(name:"language_code")

  customisationType: String @col(name:"customisation_type")

  customisationCode: String @col(name:"customisation_code")

  editionCode: String @col(name:"edition_code")

  itemCode: String! @col(name:"item_code") @unique

  mrp: Float

  isbnNo: String @col(name:"isbn_no")

  obsolete: Boolean

  createdAt: Timestamp!
  updatedAt: Timestamp!
  syncedAt: Timestamp!
}

type BooksellerSchoolMapping
@table(name: "bookseller_school_mapping")
@unique(fields: ["booksellerCode", "booksellerSubCode", "ptCode"]) {

  id: Int64!

  booksellerCode: String!
    @col(name: "bookseller_code")

  booksellerSubCode: String
    @col(name: "bookseller_sub_code")

  ptCode: String!
    @col(name: "pt_code")

  createdAt: Timestamp!
    @col(name: "created_at")

  updatedAt: Timestamp!
    @col(name: "updated_at")
}

type SharedSchoolGroup
@table(name: "shared_school_groups") {
  id: Int64!
  groupCode: String! @col(name: "group_code") @unique
  groupName: String! @col(name: "group_name")
  active: Boolean! @default(value: true)
  syncedAt: Timestamp! @col(name: "synced_at")
}

type SharedSchoolGroupLocation
@table(name: "shared_school_group_locations")
@unique(fields: ["groupCode", "subCode"]) {
  id: Int64!
  groupCode: String! @col(name: "group_code")
  subCode: String! @col(name: "sub_code")
  name: String!
  address: String
  district: String
  state: String
  pincode: String
  centralizedDecision: String @col(name: "centralized_decision")
  syncedAt: Timestamp! @col(name: "synced_at")
}

type SharedChristianGroup
@table(name: "shared_christian_groups", key: ["groupCode"]) {
  groupCode: String! @col(name: "group_code")
  organisationName: String! @col(name: "organisation_name")
  religionDenomination: String @col(name: "religion_denomination")
  category: String
  geographyType: String @col(name: "geography_type")
  operationalAreas: String @col(name: "operational_areas")
  locationDistrict: String @col(name: "location_district")
  locationState: String @col(name: "location_state")
  pinCode: String @col(name: "pin_code")
  address: String
  phoneEmail: String @col(name: "phone_email")
  runsSchools: String @col(name: "runs_schools")
  totalSchools: String @col(name: "total_schools")
  totalStudents: String @col(name: "total_students")
  centralizedDecision: String @col(name: "centralized_decision")
  website: String
  active: Boolean! @default(value: true)
  sourceSheetRow: Int @col(name: "source_sheet_row")
  sourceHash: String @col(name: "source_hash")
  syncedAt: Timestamp! @col(name: "synced_at")
}

