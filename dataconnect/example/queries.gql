

query ListOrganisations(
  $limit: Int = 500
  $offset: Int = 0
)
  @auth(level: PUBLIC) {
  organisations(
    orderBy: [{ prCode: ASC }]
    limit: $limit
    offset: $offset
  ) {
    id
    groupCode
    ptCode
    prCode
    organisationName
    address
    district
    state
    pinCode
    phone
    email
    website
    actionStatus
    remark
    academicYear
    strength
    boardType
    sessionStartFrom
    minorityType
    saturdayStatus
    workingStatus
  }
}

query SearchOrganisations(
  $prCode: String
  $organisationName: String
  $district: String
  $state: String
  $actionStatus: String
  $workingStatus: Boolean
  $limit: Int = 25
  $offset: Int = 0
)
  @auth(level: PUBLIC) {
  organisations(
    where: {
      _and: [
        { prCode: { contains: $prCode } }
        { organisationName: { contains: $organisationName } }
        { district: { contains: $district } }
        { state: { contains: $state } }
        { actionStatus: { contains: $actionStatus } }
        { workingStatus: { eq: $workingStatus } }
      ]
    }
    orderBy: [{ organisationName: ASC }, { prCode: ASC }]
    limit: $limit
    offset: $offset
  ) {
    id
    prCode
    organisationName
    district
    state
    pinCode
    phone
    email
    website
    actionStatus
    workingStatus
  }
}

